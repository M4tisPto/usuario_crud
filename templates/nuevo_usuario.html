<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <header>
        <h1>Crear nuevo usuario</h1>
    </header>
    <form action="/registrar_usuario" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="José" required><br>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" placeholder="Antonio" required><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required><br>
        <input type="submit" value="Submit">
</form>
</body>
</html>
